<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منشئ الاختبارات الذكي - GitHub Edition</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        /* ======================== الأنماط الأساسية ======================== */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; }
        :root {
            --primary: #1e293b; --secondary: #0f172a; --accent: #2563eb;
            --accent-light: #3b82f6; --bg-body: #f1f5f9; --card-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
            --radius: 16px; --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        body { background: var(--bg-body); display: flex; min-height: 100vh; color: #1e293b; overflow: hidden; }
        
        /* الشريط الجانبي */
        .sidebar {
            width: 340px; height: 100vh; background: linear-gradient(180deg, var(--secondary) 0%, #1a2a3a 100%);
            padding: 20px; color: #e2e8f0; overflow-y: auto; box-shadow: 8px 0 30px rgba(0, 0, 0, 0.3);
            flex-shrink: 0; z-index: 100;
        }
        .sidebar-header { display: flex; align-items: center; gap: 12px; margin-bottom: 25px; padding-bottom: 15px; border-bottom: 1px solid rgba(255, 255, 255, 0.1); }
        .sidebar-header i { font-size: 28px; color: var(--accent-light); }
        .sidebar-header h2 { font-size: 18px; font-weight: 900; color: #fff; }
        
        .sidebar-label { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: #94a3b8; margin-top: 15px; margin-bottom: 5px; display: block; font-weight: 700; }
        .sidebar select, .sidebar input, .sidebar textarea {
            width: 100%; padding: 10px 12px; border: none; border-radius: 8px; background: rgba(255, 255, 255, 0.08);
            color: #fff; font-size: 13px; margin-bottom: 8px; outline: 1px solid transparent; transition: var(--transition);
        }
        .sidebar select option { background: #1e293b; color: #fff; }
        .sidebar select:focus, .sidebar input:focus { outline: 1px solid var(--accent); background: rgba(255, 255, 255, 0.12); }
        
        .btn-generate {
            width: 100%; padding: 12px; border: none; border-radius: 10px; background: var(--accent);
            color: #fff; font-weight: 700; font-size: 14px; cursor: pointer; transition: var(--transition);
            display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 15px;
        }
        .btn-generate:hover { background: var(--accent-light); transform: translateY(-2px); box-shadow: 0 5px 15px rgba(37, 99, 235, 0.4); }
        
        /* المحتوى الرئيسي */
        .main-content { flex: 1; height: 100vh; display: flex; flex-direction: column; background: #f8fafc; }
        .main-header { padding: 20px 30px; background: #fff; border-bottom: 1px solid #e2e8f0; display: flex; justify-content: space-between; align-items: center; }
        .main-header h1 { font-size: 22px; font-weight: 800; color: var(--primary); display: flex; align-items: center; gap: 10px; }
        
        .preview-container { flex: 1; padding: 30px; overflow-y: auto; display: flex; justify-content: center; }
        .preview-frame {
            width: 210mm; min-height: 297mm; background: #fff; box-shadow: 0 0 40px rgba(0,0,0,0.1);
            transform-origin: top center; transition: transform 0.3s ease;
        }
        
        .actions { display: flex; gap: 10px; }
        .btn-action { padding: 8px 16px; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 8px; color: #fff; font-size: 13px; }
        .btn-print { background: #059669; }
        .btn-pdf { background: #dc2626; }
        
        /* رسائل الحالة */
        .status-bar { padding: 5px 20px; font-size: 12px; background: #f1f5f9; border-top: 1px solid #e2e8f0; color: #64748b; }
        
        /* التنبيهات */
        #notification { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); padding: 12px 24px; border-radius: 30px; color: #fff; font-weight: 700; z-index: 1000; display: none; }
        .notify-success { background: #10b981; }
        .notify-error { background: #ef4444; }
    </style>
</head>
<body>
    <div id="notification"></div>
    
    <aside class="sidebar">
        <div class="sidebar-header">
            <i class="fas fa-robot"></i>
            <h2>منشئ الاختبارات الذكي</h2>
        </div>

        <label class="sidebar-label">قالب الاختبار</label>
        <select id="templateSelect">
            <option value="official">القالب الرسمي (وزارة التعليم)</option>
            <option value="modern">قالب عصري (Modern)</option>
            <option value="classic">قالب كلاسيكي (Classic)</option>
        </select>

        <label class="sidebar-label">المرحلة الدراسية</label>
        <select id="stageSelect">
            <option value="">تحميل البيانات...</option>
        </select>

        <label class="sidebar-label">الصف الدراسي</label>
        <select id="gradeSelect" disabled>
            <option value="">اختر المرحلة أولاً</option>
        </select>

        <label class="sidebar-label">المادة</label>
        <select id="subjectSelect" disabled>
            <option value="">اختر الصف أولاً</option>
        </select>

        <label class="sidebar-label">الكتاب / الوحدة</label>
        <select id="bookSelect" disabled>
            <option value="">اختر المادة أولاً</option>
        </select>

        <label class="sidebar-label">الفهرس / الدرس</label>
        <select id="indexSelect" disabled>
            <option value="">اختر الكتاب أولاً</option>
        </select>

        <div style="border-top: 1px solid rgba(255,255,255,0.1); margin-top: 15px; padding-top: 15px;">
            <label class="sidebar-label">إعدادات التوليد (AI)</label>
            <input type="password" id="apiKey" placeholder="مفتاح Groq API">
            <div style="display: flex; gap: 5px;">
                <input type="number" id="qCount" value="5" min="1" max="20" title="عدد الأسئلة">
                <select id="qType">
                    <option value="mixed">منوع</option>
                    <option value="mcq">اختيار من متعدد</option>
                    <option value="tf">صح وخطأ</option>
                </select>
            </div>
        </div>

        <button class="btn-generate" id="generateBtn">
            <i class="fas fa-magic"></i>
            توليد الأسئلة الذكية
        </button>

        <div style="border-top: 1px solid rgba(255,255,255,0.1); margin-top: 15px; padding-top: 15px;">
            <label class="sidebar-label">بيانات الترويسة</label>
            <input type="text" id="schoolName" placeholder="اسم المدرسة">
            <input type="text" id="teacherName" placeholder="اسم المعلم/ـة">
            <input type="text" id="examTime" placeholder="زمن الاختبار">
        </div>
    </aside>

    <main class="main-content">
        <div class="main-header">
            <h1><i class="fas fa-eye"></i> معاينة القالب</h1>
            <div class="actions">
                <button class="btn-action btn-print" onclick="window.print()"><i class="fas fa-print"></i> طباعة</button>
                <button class="btn-action btn-pdf"><i class="fas fa-file-pdf"></i> تصدير PDF</button>
            </div>
        </div>

        <div class="preview-container">
            <iframe id="previewFrame" class="preview-frame" frameborder="0"></iframe>
        </div>

        <div class="status-bar" id="statusBar">
            جاهز | البيانات محملة من GitHub JSON
        </div>
    </main>

    <script>
        // المتغيرات العالمية
        let allBooks = [];
        let currentQuestions = [];
        
        // المسارات (سيتم تغييرها بعد الرفع لـ GitHub لتكون روابط Raw إذا لزم الأمر)
        const DATA_PATH = 'data/books.json';
        const METADATA_PATH = 'data/metadata.json';

        // تحميل البيانات عند البدء
        async function init() {
            try {
                const response = await fetch(DATA_PATH);
                allBooks = await response.json();
                populateStages();
                updateStatusBar(`تم تحميل ${allBooks.length} كتاب بنجاح`);
                updatePreview();
            } catch (err) {
                showNotify('خطأ في تحميل البيانات من ملفات JSON', 'error');
                console.error(err);
            }
        }

        // تعبئة المراحل
        function populateStages() {
            const stageSelect = document.getElementById('stageSelect');
            stageSelect.innerHTML = '<option value="">اختر المرحلة</option>';
            
            // تصنيف المراحل (ابتدائي، متوسط، ثانوي)
            const stages = {
                'primary': 'المرحلة الابتدائية',
                'middle': 'المرحلة المتوسطة',
                'secondary': 'المرحلة الثانوية'
            };

            Object.entries(stages).forEach(([val, text]) => {
                const opt = document.createElement('option');
                opt.value = val;
                opt.textContent = text;
                stageSelect.appendChild(opt);
            });
        }

        // التعامل مع التغييرات في القوائم
        document.getElementById('stageSelect').addEventListener('change', function() {
            const stage = this.value;
            const gradeSelect = document.getElementById('gradeSelect');
            gradeSelect.disabled = !stage;
            gradeSelect.innerHTML = '<option value="">اختر الصف</option>';
            
            if (stage) {
                const grades = [...new Set(allBooks
                    .filter(b => getStageType(b.grade) === stage)
                    .map(b => b.grade))];
                
                grades.forEach(g => {
                    const opt = document.createElement('option');
                    opt.value = g;
                    opt.textContent = g;
                    gradeSelect.appendChild(opt);
                });
            }
        });

        document.getElementById('gradeSelect').addEventListener('change', function() {
            const grade = this.value;
            const subjectSelect = document.getElementById('subjectSelect');
            subjectSelect.disabled = !grade;
            subjectSelect.innerHTML = '<option value="">اختر المادة</option>';
            
            if (grade) {
                const subjects = [...new Set(allBooks
                    .filter(b => b.grade === grade)
                    .map(b => b.subject))];
                
                subjects.forEach(s => {
                    const opt = document.createElement('option');
                    opt.value = s;
                    opt.textContent = s;
                    subjectSelect.appendChild(opt);
                });
            }
        });

        document.getElementById('subjectSelect').addEventListener('change', function() {
            const subject = this.value;
            const grade = document.getElementById('gradeSelect').value;
            const bookSelect = document.getElementById('bookSelect');
            bookSelect.disabled = !subject;
            bookSelect.innerHTML = '<option value="">اختر الكتاب</option>';
            
            if (subject) {
                const books = allBooks.filter(b => b.grade === grade && b.subject === subject);
                books.forEach((b, index) => {
                    const opt = document.createElement('option');
                    opt.value = index; // سنستخدم الاندكس للوصول للكتاب في الفلتر
                    opt.textContent = b.book_title;
                    bookSelect.appendChild(opt);
                });
            }
        });

        document.getElementById('bookSelect').addEventListener('change', function() {
            const bookIdx = this.value;
            const grade = document.getElementById('gradeSelect').value;
            const subject = document.getElementById('subjectSelect').value;
            const indexSelect = document.getElementById('indexSelect');
            
            if (bookIdx !== "") {
                const books = allBooks.filter(b => b.grade === grade && b.subject === subject);
                const book = books[bookIdx];
                indexSelect.disabled = false;
                indexSelect.innerHTML = '<option value="">اختر الدرس/الفهرس</option>';
                
                if (book.index && book.index.length > 0) {
                    book.index.forEach(idx => {
                        const opt = document.createElement('option');
                        opt.value = idx;
                        opt.textContent = idx;
                        indexSelect.appendChild(opt);
                    });
                } else {
                    const opt = document.createElement('option');
                    opt.value = "general";
                    opt.textContent = "محتوى عام (لا يوجد فهرس)";
                    indexSelect.appendChild(opt);
                }
            }
        });

        function getStageType(gradeName) {
            if (gradeName.includes('الابتدائي')) return 'primary';
            if (gradeName.includes('المتوسط')) return 'middle';
            if (gradeName.includes('الثانوي') || gradeName.includes('مسارات')) return 'secondary';
            return '';
        }

        // تحديث المعاينة (القوالب)
        function updatePreview() {
            const template = document.getElementById('templateSelect').value;
            const frame = document.getElementById('previewFrame');
            
            let html = '';
            if (template === 'official') {
                html = getOfficialTemplate();
            } else if (template === 'modern') {
                html = getModernTemplate();
            } else {
                html = getClassicTemplate();
            }
            
            frame.srcdoc = html;
        }

        document.getElementById('templateSelect').addEventListener('change', updatePreview);

        // القوالب
        function getOfficialTemplate() {
            return `
            <!DOCTYPE html>
            <html lang="ar" dir="rtl">
            <head>
                <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
                <style>
                    body { font-family: 'Cairo', sans-serif; padding: 20px; color: #000; }
                    .header { border: 2px solid #000; padding: 10px; display: flex; justify-content: space-between; margin-bottom: 20px; }
                    .title { text-align: center; font-size: 20px; font-weight: bold; margin-bottom: 20px; }
                    .student-info { border: 1px solid #000; padding: 10px; margin-bottom: 20px; display: flex; justify-content: space-between; }
                    .question { margin-bottom: 15px; border: 1px solid #eee; padding: 10px; border-radius: 5px; }
                    .q-stem { font-weight: bold; margin-bottom: 10px; }
                    .options { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
                    @media print { body { padding: 0; } .header { border-width: 3px; } }
                </style>
            </head>
            <body>
                <div class="header">
                    <div>المملكة العربية السعودية<br>وزارة التعليم<br>${document.getElementById('schoolName').value || '[اسم المدرسة]'}</div>
                    <div style="text-align:center;">[شعار الوزارة]</div>
                    <div>المادة: ${document.getElementById('subjectSelect').value || '.......'}<br>الزمن: ${document.getElementById('examTime').value || '.......'}</div>
                </div>
                <div class="title">اختبار الفصل الدراسي الأول لعام ١٤٤٧هـ</div>
                <div class="student-info">
                    <span>اسم الطالب: ...........................................</span>
                    <span>الدرجة: ........ / ........</span>
                </div>
                <div id="questionsContainer">
                    ${renderQuestions()}
                </div>
            </body>
            </html>`;
        }

        function getModernTemplate() {
            return `
            <!DOCTYPE html>
            <html lang="ar" dir="rtl">
            <head>
                <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
                <style>
                    body { font-family: 'Cairo', sans-serif; padding: 40px; background: #fff; color: #333; }
                    .exam-card { border-radius: 15px; border: 2px solid #3b82f6; padding: 30px; position: relative; }
                    .badge { position: absolute; top: -15px; right: 30px; background: #3b82f6; color: #fff; padding: 5px 20px; border-radius: 20px; font-weight: bold; }
                    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; border-bottom: 2px solid #f0f4f8; padding-bottom: 20px; }
                    .q-block { margin-bottom: 25px; background: #f8fafc; padding: 15px; border-radius: 10px; }
                    .q-stem { color: #1e293b; font-size: 16px; font-weight: 700; margin-bottom: 12px; }
                    .opt { display: inline-block; width: 45%; margin: 5px; padding: 8px; border: 1px solid #e2e8f0; border-radius: 6px; }
                </style>
            </head>
            <body>
                <div class="exam-card">
                    <div class="badge">اختبار ذكي</div>
                    <div class="header">
                        <div><h1>${document.getElementById('subjectSelect').value || 'المادة'}</h1><p>${document.getElementById('schoolName').value || 'المدرسة'}</p></div>
                        <div style="text-align:left;"><p>التاريخ: .... / .... / ....</p><p>المعلم: ${document.getElementById('teacherName').value || '....'}</p></div>
                    </div>
                    ${renderQuestions()}
                </div>
            </body>
            </html>`;
        }

        function getClassicTemplate() {
            return `<html><body style="font-family:serif; padding:50px;">
                <h1 style="text-align:center; text-decoration:underline;">اختبار مادة ${document.getElementById('subjectSelect').value || '.......'}</h1>
                <p>اسم الطالب: ............................................................ الصف: .................</p>
                <hr>
                ${renderQuestions()}
            </body></html>`;
        }

        function renderQuestions() {
            if (currentQuestions.length === 0) {
                return '<p style="text-align:center; color:#999; padding:20px;">لا توجد أسئلة حالياً. استخدم لوحة التحكم لتوليد الأسئلة.</p>';
            }
            return currentQuestions.map((q, i) => `
                <div class="question">
                    <div class="q-stem">${i+1}. ${q.stem}</div>
                    <div class="options">
                        ${q.options ? q.options.map((opt, j) => `<div>${['أ','ب','ج','د'][j]}) ${opt.text}</div>`).join('') : ''}
                    </div>
                </div>
            `).join('');
        }

        // المساعدات
        function showNotify(msg, type) {
            const n = document.getElementById('notification');
            n.textContent = msg;
            n.className = type === 'success' ? 'notify-success' : 'notify-error';
            n.style.display = 'block';
            setTimeout(() => n.style.display = 'none', 3000);
        }

        function updateStatusBar(msg) {
            document.getElementById('statusBar').textContent = msg;
        }

        // تشغيل البداية
        init();
    </script>
</body>
</html>
